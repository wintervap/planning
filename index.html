<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planning Cigusto</title>
<meta name="apple-mobile-web-app-title" content="Planning">
<meta name="application-name" content="Planning">
<meta name="theme-color" content="#1e3863">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
       background:#f5f7fb;color:#1e3863;font-family:Arial,Helvetica,sans-serif;text-align:center;padding:16px;box-sizing:border-box}
  img{width:96px;height:96px;border-radius:22px}
  a{display:inline-block;background:#1e3863;color:#fff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:12px}
  p{margin:0;font-size:14px;color:#63738a}
</style>
</head>
<body>
<img src="icon-192.png" alt="">
<p id="msg">Ouverture du planning…</p>
<a id="go" href="https://script.google.com/macros/s/AKfycbxVHPVpiwXItSddOlCAHQJdVIsXgKOsKDi6YF4gjVmHzW__Txlt3N4ols0NiTVD-K2uRA/exec">Ouvrir le planning</a>
<p id="aide" hidden>iPhone : bouton Partager, puis « Sur l'écran d'accueil ».<br>Android : menu ⋮, puis « Ajouter à l'écran d'accueil ».<br>PC (Chrome) : menu ⋮, « Caster, enregistrer et partager », puis « Créer un raccourci ».</p>
<script>
  // Redirection automatique, sauf si la page vient d'être ouverte pour l'ajouter à l'écran d'accueil (?installer).
  // En mode installation, on retire ?installer de l'adresse pour que le raccourci enregistré redirige bien.
  if (/[?&]installer\b/.test(location.search)) {
    history.replaceState(null, '', location.pathname);
    document.getElementById('msg').textContent = 'Ajoutez cette page à votre écran d\'accueil ou à votre bureau :';
    document.getElementById('aide').hidden = false;
  } else {
    setTimeout(function () { location.replace(document.getElementById('go').href); }, 300);
  }
</script>
</body>
</html>
